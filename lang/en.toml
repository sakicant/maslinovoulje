We take the olives to the local mill on the day we pick them, and they are pressed the same night.

Fresh oil is cloudy. Over the following months it settles, and we rack it off its sediment.
"""
place_title = "The place"
place = """
Piramatovci is a village in the hills behind Skradin, near Krka National Park, in Šibenik-Knin County, Croatia.
"""

