# English text. One file per language; copy this file to add a language.
#
# Text markup (works in every multi-line text):
#   blank line        new paragraph
#   - item            bullet list
#   **bold**          bold
#   [label](page:shop)  link to another page in the same language (page ids: see build.py PAGES)
#   [[note]]          visible placeholder box for something still OPEN
#   {brand} {category} {year} {email} {phone}   filled from config/site.toml
#
# Rules: no em dashes. No "extra virgin", no variety name, no "cold pressed",
# no "organic". Use only the harvest facts from the brief.

