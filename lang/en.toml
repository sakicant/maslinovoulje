harvest = """
We pick in November. Two or three of us work the trees with hand-held olive shakers and lay nets underneath to catch the fruit.

In {year} the fruit was mostly green, with some olives turning purple. After two weeks of rain it was a heavy crop.
"""
mill_title = "Pressed the same night"
