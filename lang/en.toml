# ------------------------------------------------------------------
# Emails. Placeholders: {ref} {name} {items} {subtotal} {shipping} {total}
# {delivery} {address} {reply_hours} {hold_hours} {brand} {email} {phone}
# {tracking} {invoice} {pay_until}
# ------------------------------------------------------------------
[email.order_received]
subject = "Order request {ref} received"
body = """
Hello {name},

thank you for your order request {ref}. It has reached us.

This is not a payment. Nothing has been charged.

{items}

Bottles: {subtotal}
Shipping: {shipping}
Total: {total}

Delivery: {delivery}
{address}

Within {reply_hours} hours we will email you the payment details. We hold your bottles for {hold_hours} hours.

If something is not right, just reply to this email.

{brand} family
{email}
"""

[email.payment_request]
subject = "Payment details for order {ref}"
body = """
Hello {name},

thank you again for your order {ref}.

Total including shipping: {total}

You can pay by:
[PAYMENT METHODS: card payment link or bank transfer details go here]

Please pay by {pay_until}. We hold your bottles until then.

As soon as the payment arrives, we pack your parcel and send you the tracking number.

{brand} family
{email}
"""

[email.shipped]
subject = "Your order {ref} is on its way"
body = """
Hello {name},

your parcel has left Piramatovci.

Tracking number: {tracking}
Invoice number: {invoice}

Fresh oil can look cloudy. That is normal; it settles over time.

Thank you for ordering from us.

{brand} family
{email}
"""
