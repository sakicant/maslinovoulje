[pages.home]
slug = ""
title = "{brand} {category} from Piramatovci, Croatia"
description = "Family olive oil from old trees in Piramatovci, near Skradin. A few hundred bottles per harvest, shipped within the EU."
kicker = "Harvest {year} · Piramatovci, Croatia"
h1 = "Olive oil from our family's old trees"
lead = "A few hundred bottles a year. Picked by our family near Skradin and Krka National Park, and pressed the same night at the local mill."
cta_shop = "Order bottles"
cta_story = "Our story"
intro_title = "What it is"
intro = """
Olive oil from the trees on our family land in Piramatovci, a village above Skradin. Some of the trees are so old that their trunks have gone hollow.

We pick in November, two or three of us, with hand-held shakers and nets. The olives go to the local mill and are pressed the same night.

For two years we sold this oil only to neighbours and friends, in litre bottles. Now you can order it home.
"""
bottles_title = "Three bottles"
bottles_more = "See all bottles and sets"
place_title = "Where it comes from"
place = """
Piramatovci lies in the hills behind Skradin, close to Krka National Park. The oil is from one place and one family.
"""
limited_title = "When it is gone, it is gone"
limited = """
One harvest gives a few hundred bottles. We do not buy in oil from anyone else, so when this year's bottles are sold, the next ones come with the next harvest.
"""

