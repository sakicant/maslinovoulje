[pages.privacy]
slug = "datenschutz"
title = "Datenschutzerklärung | {brand}"
description = "Wie wir mit Ihren Daten umgehen."
h1 = "Datenschutzerklärung"
body = """
[[Platzhalter. Die Datenschutzerklärung folgt nach der Registrierung des Betriebs.]]

Was die Seite heute tut:

- Bestellanfragen speichern Name, Kontaktdaten, Adresse und Bestellung, damit wir liefern und eine Rechnung stellen können.
- Die Warteliste speichert Ihre E-Mail und Sprache, nur um Ihnen zu sagen, wann es Flaschen gibt.
- Ihr Warenkorb bleibt in Ihrem eigenen Browser, bis Sie ihn absenden.
- Keine Tracking-Skripte, keine Werbe-Cookies, keine eingebetteten Inhalte Dritter.
- Wenn Sie über eine Verkostungskarte gekommen sind, wird der Code der Karte mit Ihrer Bestellung gespeichert, damit wir wissen, wo Sie das Öl probiert haben.
"""

