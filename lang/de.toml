Das ist keine Zahlung. Es wurde nichts berechnet.

{items}

Flaschen: {subtotal}
Versand: {shipping}
Gesamt: {total}

Lieferung: {delivery}
{address}

Innerhalb von {reply_hours} Stunden senden wir Ihnen die Zahlungsdaten. Wir halten Ihre Flaschen {hold_hours} Stunden für Sie zurück.

