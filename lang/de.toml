[ZAHLUNGSARTEN: Link zur Kartenzahlung oder Bankverbindung hier einfügen]

Bitte zahlen Sie bis {pay_until}. Bis dahin halten wir Ihre Flaschen zurück.

Sobald die Zahlung da ist, packen wir Ihr Paket und schicken Ihnen die Sendungsnummer.

Familie {brand}
{email}
"""

[email.shipped]
subject = "Ihre Bestellung {ref} ist unterwegs"
