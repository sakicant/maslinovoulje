Maslinovo ulje sa stabala na našoj obiteljskoj zemlji u Piramatovcima, selu iznad Skradina.

Beremo u studenom, dvoje ili troje nas, ručnim tresačicama i mrežama. Masline vozimo na prešanje u lokalnu uljaru.

Do sada smo ovo ulje dijelili samo unutar obitelji, sa susjedima i prijateljima. Sada ga možete naručiti kući.
"""
